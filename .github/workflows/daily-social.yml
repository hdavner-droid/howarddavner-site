name: Daily social post

# Runs on GitHub's servers every day. Posts the next queued item to Postiz,
# which pushes it straight to the connected channel. No Claude session,
# no computer, no Postiz scheduler needed.

on:
  schedule:
    - cron: '0 13 * * *'   # daily 13:00 UTC (9am ET)
  workflow_dispatch: {}     # manual run from the Actions tab

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Post next queued item
        env:
          POSTIZ_API_KEY: ${{ secrets.POSTIZ_API_KEY }}
        run: node scripts/post-next-social.js

      - name: Commit & push if changed
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "howard-site-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "Daily social post published"
            git push
          else
            echo "Nothing to commit."
          fi
