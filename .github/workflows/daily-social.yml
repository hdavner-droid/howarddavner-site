name: Daily social post

# PAUSED 2026-08-24. Do not re-enable until Postiz delivery is verified ON LinkedIn itself.
#
# Why: Postiz marked a test post PUBLISHED (post id cmt78py3i00hwpf0yngf6iuad, 12:56 UTC)
# and it never appeared on linkedin.com/in/howarddavner. The 08-21 and 08-23 scheduled
# posts failed the same silent way. Separately, a linkedin-page post sat in QUEUE past
# its 13:00 UTC slot. Postiz returns 2xx and reports success, so this workflow would
# report green every day while publishing nothing - worse than not running at all.
#
# To re-enable: verify a post actually appears on LinkedIn, then uncomment the schedule.

on:
  # schedule:
  #   - cron: '0 13 * * *'   # daily 13:00 UTC (9am ET) - PAUSED, see above
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Post next queued item
        env:
          POSTIZ_API_KEY: ${{ secrets.POSTIZ_API_KEY }}
        run: node scripts/post-next-social.js

      - name: Commit & push if changed
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "howard-site-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "Daily social post published"
            git push
          else
            echo "Nothing to commit."
          fi
