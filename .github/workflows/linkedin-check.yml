name: LinkedIn token check (no posting)

# Manual smoke test. Confirms LINKEDIN_ACCESS_TOKEN is present, valid, and
# resolves an author URN - without publishing anything or touching the queue.
# Run this first after adding or rotating the secret.

on:
  workflow_dispatch: {}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Verify token
        env:
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          DRY_RUN: 'true'
        run: node scripts/post-next-linkedin.js
