name: Check Postiz connection

# Manual only. Verifies the POSTIZ_API_KEY secret works and lists the
# connected channels. Never posts anything.

on:
  workflow_dispatch: {}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Verify Postiz API key
        env:
          POSTIZ_API_KEY: ${{ secrets.POSTIZ_API_KEY }}
        run: node scripts/check-postiz.js
