name: Publish

# Netlify is Git-linked to this repo, so a push to main IS the deploy.
# This workflow's job is to keep insights.html and sitemap.xml in step with
# the files in insights/ and press/, then confirm the deploy actually landed.
#
# The bot's own commit touches only insights.html / sitemap.xml, which are
# outside the paths filter below — so it cannot retrigger itself.
on:
  push:
    branches: [main]
    paths:
      - 'insights/**'
      - 'press/**'
      - 'scripts/publish.py'
  schedule:
    # Mondays 13:00 UTC — 9:00 AM Eastern in summer, 8:00 AM in winter.
    # Pinned to UTC deliberately: GitHub cron has no timezone support, so
    # the alternative is an hour of silent drift twice a year.
    # On a quiet week this run is a drift alarm: it re-checks that every
    # article in the repo is actually being served.
    - cron: '0 13 * * 1'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Wire new articles into index and sitemap
        run: python3 scripts/publish.py

      - name: Commit changes
        id: commit
        run: |
          if git diff --quiet -- insights.html sitemap.xml; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No index or sitemap changes."
          else
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add insights.html sitemap.xml
            git commit -m "chore: wire new articles into index and sitemap"
            # Another commit may have landed while this run was working.
            # Rebase onto it rather than failing or clobbering it.
            git pull --rebase origin main
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # Runs every time, changed or not. Asserts the live sitemap covers every
      # article in the repo and that each URL resolves — not merely that the
      # domain answers. Fails the run if the site is behind.
      - name: Verify live
        run: python3 scripts/publish.py --verify-live
