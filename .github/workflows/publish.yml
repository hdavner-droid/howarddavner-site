name: Publish

# Fires when an article file is added or changed, on a weekly sweep, and
# on demand. The bot's own commit touches only insights.html / sitemap.xml,
# which are outside the paths filter below — so it cannot retrigger itself.
on:
  push:
    branches: [main]
    paths:
      - 'insights/**'
      - 'press/**'
      - 'scripts/publish.py'
  schedule:
    # Mondays 13:00 UTC — 9:00 AM Eastern in summer, 8:00 AM in winter.
    # Pinned to UTC deliberately: GitHub cron has no timezone support, so
    # the alternative is an hour of silent drift twice a year.
    - cron: '0 13 * * 1'
  workflow_dispatch:
    inputs:
      deploy_anyway:
        description: 'Trigger a Netlify deploy even if nothing changed'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Wire new articles into index and sitemap
        run: python3 scripts/publish.py

      - name: Commit changes
        id: commit
        run: |
          if git diff --quiet -- insights.html sitemap.xml; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No index or sitemap changes."
          else
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add insights.html sitemap.xml
            git commit -m "chore: wire new articles into index and sitemap"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy to Netlify
        if: steps.commit.outputs.changed == 'true' || inputs.deploy_anyway
        env:
          HOOK: ${{ secrets.NETLIFY_BUILD_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "::warning::NETLIFY_BUILD_HOOK is not set — skipping deploy."
            echo "Add it under Settings > Secrets and variables > Actions,"
            echo "or link the Netlify site to this repo and delete this step."
            exit 0
          fi
          code=$(curl -sS -X POST -o /dev/null -w '%{http_code}' "$HOOK")
          echo "Netlify build hook returned HTTP $code"
          [ "$code" -ge 200 ] && [ "$code" -lt 300 ]

      - name: Verify live
        if: steps.commit.outputs.changed == 'true' || inputs.deploy_anyway
        run: |
          echo "Waiting for Netlify to publish..."
          for i in $(seq 1 20); do
            sleep 15
            code=$(curl -s -o /dev/null -w '%{http_code}' https://howarddavner.com/insights.html)
            echo "attempt $i: HTTP $code"
            if [ "$code" = "200" ]; then
              echo "Live: https://howarddavner.com/insights.html"
              exit 0
            fi
          done
          echo "::warning::Site did not return 200 within 5 minutes — check Netlify."
