name: Weekly article publish

# Runs entirely on GitHub's servers — no Claude session, no connectors, no computer.
# Publishes the next queued article, which pushes to main and triggers Netlify auto-deploy.

on:
  schedule:
    - cron: '0 16 * * 2'   # Tuesdays 16:00 UTC (noon ET)
  workflow_dispatch: {}     # lets you trigger a run manually from the Actions tab

permissions:
  contents: write            # allows the built-in token to commit + push

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Publish next queued article
        run: node scripts/publish-next.js

      - name: Commit & push if changed
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "howard-site-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "Auto-publish weekly article"
            git push
          else
            echo "Queue empty — nothing to publish this week."
          fi
