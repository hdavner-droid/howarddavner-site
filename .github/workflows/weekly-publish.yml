name: Weekly article publish

# Runs entirely on GitHub's servers - no Claude session, no connectors, no computer.
# 1. Publishes the next queued article (pushes to main -> Netlify auto-deploys)
# 2. Tops the queue back up by writing new articles, so it never runs dry
# 3. Submits the new URL to IndexNow so it gets crawled quickly
# 4. Syndicates the article to Dev.to via Postiz, canonical pointing back to the site

on:
  schedule:
    - cron: '0 16 * * 2'   # Tuesdays 16:00 UTC (noon ET)
  workflow_dispatch: {}     # lets you trigger a run manually from the Actions tab

permissions:
  contents: write            # allows the built-in token to commit + push

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Publish next queued article
        run: node scripts/publish-next.js

      - name: Top the queue back up
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TARGET_QUEUE: '4'
          MAX_PER_RUN: '2'
        run: node scripts/write-next-article.js

      - name: Commit & push if changed
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "howard-site-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "Auto-publish weekly article"
            git push
          else
            echo "Queue empty - nothing to publish this week."
          fi

      - name: Wait for Netlify to deploy
        if: env.PUBLISHED_URL != ''
        run: sleep 90

      - name: Submit new URL to IndexNow
        if: env.PUBLISHED_URL != ''
        run: node scripts/ping-indexnow.js

      - name: Syndicate to Dev.to
        if: env.PUBLISHED_URL != ''
        env:
          POSTIZ_API_KEY: ${{ secrets.POSTIZ_API_KEY }}
        run: node scripts/syndicate-devto.js
